[project]
name = "foyer-claims-assistant"
version = "0.1.0"
description = "Cited claim-coverage assistant over insurance policy documents"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101", "B008", "RUF001", "RUF002", "RUF003", "UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"app/catalog/parsing.py" = ["S"]
"scripts/demo/*" = ["E501"]  # long prose strings in the scripted demo model

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
