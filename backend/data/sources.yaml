# Seed catalogue: which public documents make up each demo contract.
# Files under data/raw are NOT committed (third-party documents); run
#   python scripts/fetch_sources.py
# to download them from the public URLs below. Foyer's full conditions
# generales are gated behind a customer + contract number, so only the public
# IPID and brochure are used for Foyer.
contracts:
  - id: foyer-mozaik
    insurer: Foyer Assurances S.A.
    product: Mozaik (home)
    country: LU
    language: fr
    synthetic: false
    documents:
      - id: foyer-mozaik-ipid
        title: Mozaik - Insurance Product Information Document (IPID)
        kind: ipid
        file: raw/foyer_mozaik_ipid.pdf
        source_url: https://www.foyer.lu/fr/mydoc/12704
        version_label: "09/2021"
        effective_from: "2021-09-01"
      - id: foyer-mozaik-brochure
        title: Mozaik - product brochure (marketing)
        kind: brochure
        file: raw/foyer_mozaik_brochure.pdf
        source_url: https://www.foyer.lu/fr/mydoc/12712
        version_label: "MOZAIK 2026"
        effective_from: "2026-01-01"

