name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests evals
      - run: ruff format --check app tests evals
      - run: mypy app
      # Includes the OpenAPI drift test: the committed contract must match the code.
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Types are generated from docs/openapi.json; fail if the committed file is stale.
      - run: npm run gen:api
      - run: git diff --exit-code -- src/api/api-types.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
